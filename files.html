<!DOCTYPE html>
<html lang="en">
   <head>
      <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
         />
      <title>Files</title>
      <link rel="shortcut icon" href="assets/icons/computer-3.png" type="image/png" />
      <link rel="stylesheet" type="text/css" href="assets/css/terminal.css?v=3" />
   </head>
   <body>
      <div id="term">
         <div id="term-output"></div>
         <div id="term-input-line">
            <span class="prompt"></span>
            <input id="term-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="terminal input" />
         </div>
      </div>
      <script>
         window.TERM_CONFIG = {
            mode: "files",
            prompt: "guest@e1i.xyz:~/files$",
            // published-to-web CSV — col B = link, col C = display name (unchanged contract)
            sheetUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnbOxOtpBxz4xGZaSZFvHKOggqbbIHeQ-R75tb1l-nfVTEJYttADP9sVFCWXPMQMfeHhFZLKJ1w8LC/pub?output=csv",
            banner: [
               "e1i.xyz file server — connection established.",
               "loading file index...",
               ""
            ]
         };
      </script>
      <script src="assets/js/terminal.js?v=3"></script>
   </body>
</html>
